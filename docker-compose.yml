services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assay
      POSTGRES_PASSWORD: assay
      POSTGRES_DB: assay
    ports: ["5432:5432"]
    volumes: ["assay-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assay"]
      interval: 5s
      retries: 10
volumes:
  assay-pg:
